<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporteador PDV Sucursal</title>
    <link rel="stylesheet" href="./src/styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-top: 0; }
        .tab-bar { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input[type="text"], input[type="password"], input[type="email"], input[type="date"], select, input[type="time"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: 'Inter';
        }
        button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; width: 100%; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reporteador PDV</h1>
        
        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('send-tab')">Enviar Reporte</div>
            <div class="tab" onclick="switchTab('config-tab')">Configuración</div>
        </div>

        <!-- Enviar Reporte Tab -->
        <div id="send-tab" class="tab-content active">
            <div class="form-group">
                <label for="start-date">Fecha de Inicio:</label>
                <input type="date" id="start-date">
            </div>
            <div class="form-group">
                <label for="end-date">Fecha de Fin:</label>
                <input type="date" id="end-date">
            </div>
            <button id="btn-send" onclick="sendReport()">Generar y Enviar por Correo</button>
            <div id="send-status" class="status"></div>
        </div>

        <!-- Configuración Tab -->
        <div id="config-tab" class="tab-content">
            <div class="form-group">
                <label for="branch-name">Nombre de Sucursal (ej. Matriz):</label>
                <input type="text" id="branch-name">
            </div>
            <div class="form-group">
                <label for="smtp-user">Correo Gmail Emisor:</label>
                <input type="email" id="smtp-user" placeholder="tucorreo@gmail.com">
            </div>
            <div class="form-group">
                <label for="smtp-pass">Contraseña de Aplicación (Gmail):</label>
                <input type="password" id="smtp-pass">
            </div>
            <div class="form-group">
                <label for="target-email">Correo Destino (Dueño):</label>
                <input type="email" id="target-email" placeholder="dueño@empresa.com">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <h3>Automatización (Envíos Automáticos)</h3>
            <div class="form-group">
                <label for="auto-day">Día de la semana:</label>
                <select id="auto-day">
                    <option value="Monday">Lunes</option>
                    <option value="Tuesday">Martes</option>
                    <option value="Wednesday">Miércoles</option>
                    <option value="Thursday">Jueves</option>
                    <option value="Friday">Viernes</option>
                    <option value="Saturday">Sábado</option>
                    <option value="Sunday">Domingo</option>
                </select>
            </div>
            <div class="form-group">
                <label for="auto-time">Hora de envío:</label>
                <input type="time" id="auto-time">
            </div>

            <button id="btn-save" onclick="saveConfig()">Guardar Configuración</button>
            <div id="config-status" class="status"></div>
        </div>
    </div>

    <script src="./src/main.js"></script>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
