name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI (Wails)
        working-directory: ./gui
        run: |
          $env:GOARCH="386"
          wails build -platform windows/386 -clean
          if (Test-Path "build\bin\reporteador-gui.exe") {
              mkdir -Force ..\release
              move build\bin\reporteador-gui.exe ..\release\reporteador-gui.exe
          } else {
              mkdir -Force ..\release
              move build\bin\*.exe ..\release\reporteador-gui.exe
          }

      - name: Build Worker
        env:
          GOARCH: "386"
        run: go build -ldflags="-H windowsgui -s -w" -o release/worker.exe ./cmd/worker

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer
        run: iscc installer/setup.iss

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            installer/Output/InstalarReporteadorCorreo.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
